services:
  - type: web
    name: qian-dazi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ALIPAY_ENV
        value: sandbox
      - key: ALIPAY_APP_ID
        sync: false
      - key: ALIPAY_PRIVATE_KEY
        sync: false
      - key: ALIPAY_PUBLIC_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: 22.22.2
