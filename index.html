<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钱搭子 · 存钱这件事，有人陪你一起</title>
<meta name="description" content="钱搭子——AI 陪你存钱的小屋。设个想买的目标，攒钱看得见进度，买之前先问问搭子，还能扭蛋装扮你们的小家。">
<meta property="og:title" content="钱搭子 · 存钱这件事，有人陪你一起">
<meta property="og:description" content="冲动消费前先问问你的钱搭子。攒钱有进度、有奖励、有个小家等你装扮。">
<meta name="theme-color" content="#fff5f9">
<style>
/* ============ 基础 ============ */
:root{
  --pink:#f48fb1; --pink-deep:#c2185b; --pink-soft:#fde4ee; /* 加深满足 AA 对比度 */
  --purple:#b39ddb; --purple-deep:#6a4098; --purple-soft:#efe9fb;
  --cream:#fffaf6; --ink:#3a2f38; --ink-soft:#6d5d69;        /* 提升文字对比度 */
  --gold:#c8860a; --green:#2e9e74; --line:#f0e2ea;
  --shadow:0 8px 30px rgba(214,140,175,.14);
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:linear-gradient(160deg,#fff5f9 0%,#f6f0ff 50%,#fff8f2 100%);
  color:var(--ink);overflow-x:hidden;font-size:14px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
.hidden{display:none!important}

/* ============ 开屏 ============ */
.splash{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(circle at 50% 32%,#fff 0%,#ffeaf3 42%,#e9dcff 100%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:opacity .6s ease,transform .6s ease;
}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash-stars{position:absolute;inset:0;background-image:
  radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent),
  radial-gradient(2px 2px at 70% 18%,#fff 50%,transparent),
  radial-gradient(3px 3px at 82% 60%,#ffd9e8 50%,transparent),
  radial-gradient(2px 2px at 32% 72%,#fff 50%,transparent),
  radial-gradient(2px 2px at 58% 80%,#e6d4ff 50%,transparent);
  background-size:220px 220px;opacity:.7;animation:floatSlow 8s ease-in-out infinite}
@keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.splash-inner{position:relative;width:min(420px,90vw);text-align:center;padding:20px}
.splash-logo{margin-bottom:4px}
.logo-mark{
  width:76px;height:76px;margin:0 auto 14px;border-radius:50%;
  background:linear-gradient(145deg,#ffd0e2,#f7a8c8 60%,#e58fb6);
  box-shadow:0 10px 26px rgba(236,106,153,.35),inset 0 -6px 12px rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;
}
.logo-mark .coin{font-size:40px;color:#fff;font-weight:700;text-shadow:0 2px 4px rgba(190,80,120,.3)}
@keyframes pop{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1);opacity:1}}
.logo-title{font-size:30px;margin:0;letter-spacing:2px;
  background:linear-gradient(90deg,var(--pink-deep),var(--purple-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .6s .15s both}
.logo-sub{font-size:13px;color:var(--ink-soft);margin:8px 0 0;animation:rise .6s .25s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.splash-mascot{height:290px;margin:6px auto -34px;display:flex;align-items:flex-end;justify-content:center;
  animation:mascotIn .8s .1s both}
.splash-mascot img{height:100%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(200,120,160,.25));
  animation:bob 3s ease-in-out infinite}
@keyframes mascotIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sprite-bubble{
  display:inline-block;background:#fff;border:1.5px solid var(--line);
  padding:9px 16px;border-radius:16px 16px 16px 4px;font-size:12.5px;color:var(--ink);
  box-shadow:var(--shadow);position:relative;z-index:2;animation:rise .6s .4s both}
.loading-block{margin:26px auto 0;width:min(280px,80vw);animation:rise .6s .5s both}
.loading-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px}
.loading-track{height:9px;border-radius:9px;background:#f0e2ea;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.05)}
.loading-fill{height:100%;width:0;border-radius:9px;
  background:linear-gradient(90deg,#ffc0d8,#f48fb1,#b39ddb);transition:width .25s ease;
  box-shadow:0 0 10px rgba(244,143,177,.6)}
.sound-toggle{margin-top:18px;font-size:12px;color:var(--purple-deep);
  border:1.5px solid var(--purple);border-radius:20px;padding:7px 16px;
  animation:rise .6s .6s both;transition:.2s}
.sound-toggle:hover{background:var(--purple-soft)}
.sound-icon{font-size:14px;margin-right:4px}
.sound-toggle.playing{background:var(--purple);color:#fff}

/* ============ 角色选择 ============ */
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.setup-card{width:min(520px,100%);background:#fff;border-radius:28px;padding:34px 26px;
  box-shadow:var(--shadow);text-align:center;border:1px solid var(--line)}
.setup-card h2{font-size:20px;margin:0 0 6px}
.setup-tip{font-size:12.5px;color:var(--ink-soft);margin:0 0 24px}
.char-options{display:flex;gap:16px;justify-content:center;margin-bottom:26px}
.char-option{flex:1;max-width:190px;border:2.5px solid transparent;border-radius:20px;padding:12px 8px;
  background:linear-gradient(160deg,#fff5f9,#f6f0ff);transition:.2s;position:relative}
.char-option.selected{border-color:var(--pink);box-shadow:0 8px 22px rgba(244,143,177,.28);transform:translateY(-4px)}
.char-option.selected::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;
  border-radius:50%;background:var(--pink);color:#fff;font-size:14px;line-height:22px;font-weight:700}
.char-option img{height:210px;object-fit:contain;margin:0 auto}
.char-name{font-weight:700;font-size:15px;margin-top:6px}
.char-name span{font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-left:4px}
.btn-primary{background:linear-gradient(120deg,var(--pink),var(--purple-deep));color:#fff;
  padding:14px 30px;border-radius:30px;font-size:15px;font-weight:700;
  box-shadow:0 8px 20px rgba(180,120,190,.3);transition:.2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(180,120,190,.4)}
.btn-primary:active{transform:translateY(0)}

/* ============ 应用布局 ============ */
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:78px;position:relative}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:rgba(255,250,246,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.topbar-left{display:flex;align-items:center;gap:10px}
.avatar-mini{width:42px;height:42px;border-radius:50%;background:var(--pink-soft);
  border:2px solid #fff;box-shadow:0 2px 8px rgba(200,140,170,.25);overflow:hidden;flex-shrink:0}
.avatar-mini img{width:100%;height:100%;object-fit:cover;object-position:top center}
.topbar-greet{display:flex;flex-direction:column;line-height:1.3}
.topbar-greet span{font-size:12.5px;color:var(--ink-soft)}
.topbar-greet strong{font-size:15px}
.topbar-right{display:flex;align-items:center;gap:10px}
.coin-badge{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px;color:var(--purple-deep);cursor:pointer;transition:.2s}
.coin-badge:active{transform:scale(.94)}
.coin-dot{color:var(--gold)}
.diamond-badge{color:#1aa4d6;border-color:#bfe8f7}
.diamond-dot{color:#29b6e8;font-size:14px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);
  color:var(--purple-deep);font-size:16px;transition:.2s}
.icon-btn.off{color:#ccc}
.page-container{padding:16px 16px 8px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 底部导航 ============ */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  z-index:30;display:flex;justify-content:space-around;align-items:center;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 4px 10px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-soft);
  flex:1;transition:.2s;padding:2px 0}
.nav-item .nav-ico{font-size:20px;line-height:1.2}
.nav-item.active{color:var(--pink-deep);font-weight:700}
.nav-item.active .nav-ico{transform:scale(1.12)}
.nav-gacha .nav-ico{width:40px;height:40px;margin-top:-18px;border-radius:50%;
  background:linear-gradient(140deg,var(--pink),var(--purple-deep));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 6px 16px rgba(200,120,180,.4);border:3px solid #fff}
.nav-gacha{margin-top:6px}

/* ============ 通用卡片 ============ */
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  border:1px solid var(--line);margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:7px}
.card-title .em{font-size:17px}
.section-sub{font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-left:auto}

/* ============ 首页 ============ */
.hero-card{background:linear-gradient(135deg,#fff0f6 0%,#f3eaff 100%);position:relative;overflow:hidden;
  display:flex;align-items:center;min-height:170px}
.hero-text{flex:1;z-index:2;padding-right:6px}
.hero-text .hi{font-size:12px;color:var(--ink-soft)}
.hero-text h2{font-size:19px;margin:5px 0 10px;line-height:1.4}
.hero-total{font-size:13px;color:var(--ink-soft)}
.hero-total b{font-size:30px;color:var(--pink-deep);display:block;line-height:1.1}
.hero-total b small{font-size:14px;color:var(--ink-soft);font-weight:400;margin-left:2px}
.hero-char{width:118px;align-self:stretch;position:relative;flex-shrink:0}
.hero-char .char-visual{position:absolute;bottom:0;right:-6px;width:118px;height:100%}
.hero-char img{position:absolute;bottom:-2px;right:0;height:100%;width:100%;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 8px 12px rgba(200,130,170,.3));animation:bob 3.4s ease-in-out infinite}
.hero-char .hero-char-img{filter:drop-shadow(0 8px 12px rgba(200,130,170,.3))}
.hero-bubble{position:absolute;top:14px;right:-6px;background:#fff;padding:7px 11px;border-radius:14px 14px 4px 14px;
  font-size:12.5px;box-shadow:var(--shadow);z-index:3;max-width:150px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.quick-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 4px 12px;
  text-align:center;box-shadow:var(--shadow);transition:.2s}
.quick-item:active{transform:scale(.96)}
.quick-ico{width:42px;height:42px;margin:0 auto 7px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:21px;color:#fff}
.quick-item:nth-child(1) .quick-ico{background:linear-gradient(140deg,#ffb3cf,#f48fb1)}
.quick-item:nth-child(2) .quick-ico{background:linear-gradient(140deg,#c9a7ec,#9575c9)}
.quick-item:nth-child(3) .quick-ico{background:linear-gradient(140deg,#ffd07a,#f5a623)}
.quick-item:nth-child(4) .quick-ico{background:linear-gradient(140deg,#8fdcc4,#4fb894)}
.quick-item span{font-size:12.5px;color:var(--ink)}
.goal-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(120deg,#fff8fb,#faf6ff);
  border:1px dashed var(--pink)}
.goal-thumb{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;box-shadow:var(--shadow)}
.goal-info{flex:1;min-width:0}
.goal-info .g-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-info .g-meta{font-size:12.5px;color:var(--ink-soft);margin:3px 0 6px}
.progress-track{height:8px;background:#f0e2ea;border-radius:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#ffb3cf,var(--pink-deep));transition:width .5s ease}
.goal-pct{font-weight:700;color:var(--pink-deep);font-size:14px;flex-shrink:0}

/* ============ 存钱页 ============ */
.piggy-scene{text-align:center;padding:8px 0 4px}
.piggy-bank{width:120px;height:120px;margin:0 auto;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,#ffd9e7,#f7a8c8 70%,#e58fb6);
  box-shadow:0 12px 26px rgba(236,106,153,.3),inset 0 -8px 14px rgba(190,80,120,.15);
  display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .3s}
.piggy-bank.drop{animation:piggyDrop .5s ease}
@keyframes piggyDrop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-6deg)}100%{transform:scale(1)}}
.piggy-water{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.35));
  transition:height .8s cubic-bezier(.2,.9,.3,1)}
.piggy-face{position:relative;z-index:2;font-size:46px;filter:drop-shadow(0 2px 3px rgba(180,80,120,.3))}
.piggy-amount{font-size:13px;color:var(--ink-soft);margin-top:12px}
.piggy-amount b{font-size:26px;color:var(--pink-deep);display:block}
.piggy-goal{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.amount-input-row{display:flex;gap:8px;margin:16px 0}
.amount-input-row input{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;
  background:#fff;outline:none;transition:.2s;min-width:0}
.amount-input-row input:focus{border-color:var(--pink)}
.amount-chips{display:flex;gap:8px;justify-content:center;margin-bottom:6px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;transition:.2s}
.chip:active,.chip.sel{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-deep);font-weight:700}
/* 存钱页目标环形进度主视觉 */
.goal-hero{display:flex;align-items:center;gap:16px;padding:18px 16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fff5fa,#f3ecff)}
.gh-ring-wrap{flex-shrink:0;width:112px;height:112px}
.goal-ring{position:relative;width:112px;height:112px}
.goal-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal-ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring-bg{stroke:#f0e4ee}
.ring-fg{stroke:var(--pink-deep);transition:stroke-dashoffset .6s ease}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center b{font-size:26px;color:var(--pink-deep);line-height:1}
.ring-center b small{font-size:12px}
.ring-center span{font-size:18px;margin-top:2px}
.gh-info{flex:1;min-width:0}
.gh-label{font-size:12.5px;color:var(--purple-deep);font-weight:700;letter-spacing:1px}
.gh-name{font-size:17px;font-weight:700;margin:3px 0 8px;color:var(--ink)}
.gh-remain{font-size:13px;color:var(--ink-soft)}
.gh-remain b{font-size:22px;color:var(--pink-deep)}
.gh-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;color:var(--ink-soft)}
.gh-stats b{color:var(--ink)}
.piggy-bank-mini{position:absolute;right:10px;top:8px;font-size:24px;opacity:.5}
.piggy-bank-mini.drop{animation:charHappy .5s ease}
/* 目标列表（可选中 + 操作） */
.goal-item{display:flex;align-items:center;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal-item:last-child{border-bottom:none}
.goal-item .g-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.goal-item.done{opacity:.6}
.goal-item .g-emoji{font-size:26px;width:42px;text-align:center}
.goal-item .g-body{flex:1;min-width:0}
.goal-item .g-title{font-size:13.5px;font-weight:700}
.goal-item .g-bar{height:7px;background:var(--line);border-radius:7px;margin-top:6px;overflow:hidden}
.goal-item .g-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb3cf,var(--pink-deep));border-radius:7px}
.goal-item .g-num{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.goal-item .g-sel{width:22px;text-align:center;color:var(--pink-deep);font-weight:700;flex-shrink:0}
.goal-item .g-actions{display:flex;gap:2px;flex-shrink:0}
.g-act{width:30px;height:30px;border-radius:9px;background:#faf6fa;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.2s}
.g-act:active{transform:scale(.9)}
.g-act.danger{background:#fff0f0}
.g-done-tag{font-size:9.5px;color:var(--green);background:#eaf8f0;border-radius:8px;padding:1px 6px;font-weight:400;margin-left:4px}
.ask-btn{width:100%;background:linear-gradient(120deg,var(--purple),var(--pink));color:#fff;padding:14px;
  border-radius:16px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 18px rgba(180,120,190,.28);transition:.2s}
.ask-btn:active{transform:scale(.98)}
.empty-state{text-align:center;padding:24px 10px;color:var(--ink-soft);font-size:12.5px}
.empty-state .e-ico{font-size:34px;display:block;margin-bottom:8px}

/* ============ 扭蛋页 ============ */
.gacha-hero{text-align:center;padding:10px 0 4px}
.gacha-machine{width:180px;height:190px;margin:0 auto 14px;position:relative;
  background:linear-gradient(160deg,#fff,#ffeef6);border-radius:24px 24px 30px 30px;
  border:3px solid #fff;box-shadow:0 14px 30px rgba(200,130,170,.25),inset 0 0 0 3px var(--pink-soft)}
.gacha-globe{width:126px;height:126px;margin:16px auto 0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,200,225,.55));
  border:3px solid #fff;box-shadow:inset 0 -8px 20px rgba(230,140,180,.2);position:relative;overflow:hidden}
.gacha-ball{position:absolute;width:34px;height:34px;border-radius:50%;
  box-shadow:inset -4px -4px 8px rgba(0,0,0,.12),inset 4px 4px 6px rgba(255,255,255,.7)}
.gacha-ball::after{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:rgba(255,255,255,.8);transform:translateY(-50%)}
.gacha-machine.shake{animation:shake .6s ease}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.gacha-dispense{margin-top:12px;font-size:20px}
.gacha-cost{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.gacha-cost b{color:var(--purple-deep)}
.pool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pool-item{aspect-ratio:1;border-radius:14px;background:linear-gradient(150deg,#fff6fa,#f5efff);
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;
  position:relative;transition:.2s}
.pool-item.got{background:linear-gradient(150deg,#fff0d8,#ffe6c0);border-color:var(--gold)}
.pool-item.locked{filter:grayscale(.7);opacity:.55}
.pool-item .lock{position:absolute;bottom:4px;font-size:9px;color:var(--ink-soft)}

/* ============ 小家页（2.5D 立体房间） ============ */
.room-card-wrap{position:relative}
.room-scene{height:300px;border-radius:18px;position:relative;overflow:hidden;
  perspective:520px;perspective-origin:50% 30%;border:1px solid var(--line);
  box-shadow:var(--shadow);touch-action:none;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--sky3) 60%)}
/* 后墙（正面） */
.room-wall-back{position:absolute;left:0;right:0;top:0;height:60%;background:var(--wall);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0,rgba(0,0,0,.025) 1px,transparent 1px,transparent 42px)}
.room-wall-back::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.06))}
/* 左墙（透视） */
.room-wall-left{position:absolute;left:0;top:0;bottom:0;width:34%;
  background:linear-gradient(90deg,color-mix(in srgb,var(--wall) 82%,#8a7a86),color-mix(in srgb,var(--wall) 94%,#000));
  transform-origin:left center;transform:rotateY(38deg);opacity:.95;
  border-right:2px solid rgba(255,255,255,.35)}
/* 地板（向里旋转的平面，形成纵深） */
.room-floor{position:absolute;left:-20%;right:-20%;top:58%;bottom:-30%;
  background:repeating-linear-gradient(90deg,var(--floor1) 0,var(--floor1) 38px,var(--floor2) 38px,var(--floor2) 40px),
             var(--floor1);
  transform:rotateX(52deg);transform-origin:top center;
  box-shadow:inset 0 24px 30px rgba(0,0,0,.12)}
.room-baseboard{position:absolute;left:0;right:0;top:58%;height:5px;background:rgba(255,255,255,.55);z-index:2}
/* 地毯（椭圆，透视压扁） */
.room-rug{position:absolute;left:50%;top:74%;transform:translateX(-50%) rotateX(55deg);
  width:58%;height:120px;border-radius:50%;background:radial-gradient(ellipse,#ffffffaa,#f4d9e6 70%,transparent 72%);
  z-index:1;box-shadow:0 0 0 6px rgba(255,255,255,.18)}
/* 后墙上的窗与画 */
.room-window{position:absolute;top:14%;right:9%;width:80px;height:88px;border-radius:6px;overflow:hidden;
  border:6px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.16),inset 0 0 0 2px rgba(0,0,0,.05);z-index:3}
.window-sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.window-sky::before{content:"☁";position:absolute;top:14%;left:12%;font-size:20px;opacity:.9;color:#fff}
.window-sky::after{content:"☀";position:absolute;top:8%;right:12%;font-size:18px;color:#ffe08a}
.window-cross{position:absolute;inset:0}
.window-cross::before,.window-cross::after{content:"";position:absolute;background:#fff}
.window-cross::before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.window-cross::after{top:50%;left:0;right:0;height:4px;transform:translateY(-50%)}
.room-picture{position:absolute;top:18%;left:40%;font-size:30px;z-index:3;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.room-stars,.room-petals{position:absolute;top:6%;left:8%;right:8%;font-size:14px;color:#fff;z-index:3;
  letter-spacing:8px;opacity:.85;animation:bob 5s ease-in-out infinite}
.room-wall-label{position:absolute;top:10px;left:12px;font-size:12.5px;color:#fff;z-index:6;
  background:rgba(0,0,0,.22);padding:4px 10px;border-radius:12px;backdrop-filter:blur(4px)}
/* 角色：站在房间中下部，带落地投影 */
.room-char-wrap{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);z-index:8;cursor:pointer;
  display:flex;flex-direction:column;align-items:center}
.char-shadow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotateX(60deg);
  width:110px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(3px);z-index:-1}
.room-char{height:172px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2));
  animation:bob 3s ease-in-out infinite}
.room-char-wrap.bounce .room-char{animation:charBounce .5s ease}
@keyframes charBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-4deg)}60%{transform:translateY(-6px) rotate(3deg)}}
.char-mood{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:#fff;border:1.5px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 11px;
  font-size:12.5px;box-shadow:var(--shadow);z-index:12;color:var(--ink)}
.char-mood.pop{animation:moodPop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes moodPop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
/* 家具：带纵深缩放与投影 */
.placed-item{position:absolute;cursor:grab;user-select:none;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;line-height:1}
.furn-emoji{display:block;transform:scale(var(--fscale,1));transform-origin:bottom center;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.28));transition:transform .2s}
.placed-item:hover .furn-emoji{filter:drop-shadow(0 4px 10px rgba(236,106,153,.6))}
.placed-item.dragging .furn-emoji{transform:scale(calc(var(--fscale,1) * 1.18));
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.3))}
.furn-shadow{display:block;width:1.4em;height:.34em;margin-top:-.18em;border-radius:50%;
  background:rgba(0,0,0,.2);transform:scale(var(--fscale,1)) rotateX(50deg)}
.room-empty{position:absolute;bottom:12%;left:0;right:0;text-align:center;font-size:12.5px;color:#fff;z-index:6;
  text-shadow:0 1px 3px rgba(0,0,0,.3)}
.room-hint{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:9px 6px 0;line-height:1.5}
.room-hint span{color:var(--pink-deep);text-decoration:underline;cursor:pointer}
.inventory-grid{display:flex;gap:10px;flex-wrap:wrap}
.inv-item{width:60px;text-align:center;cursor:pointer}
.inv-item .i-ico{width:60px;height:60px;border-radius:14px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:4px;transition:.2s}
.inv-item:active .i-ico{transform:scale(.94)}
.inv-item.placed .i-ico{border-color:var(--green);box-shadow:0 0 0 2px #c9f0dd inset}
.inv-item .i-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 我的 ============ */
.me-head{display:flex;align-items:center;gap:14px;padding:6px 0 16px}
.me-avatar{width:72px;height:72px;border-radius:50%;background:var(--pink-soft);overflow:hidden;
  border:3px solid #fff;box-shadow:var(--shadow);flex-shrink:0}
.me-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
.me-info h3{margin:0 0 4px;font-size:17px}
.me-info p{margin:0;font-size:12px;color:var(--ink-soft)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.stat-box b{font-size:20px;color:var(--purple-deep);display:block}
.stat-box span{font-size:12.5px;color:var(--ink-soft)}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list-row:last-child{border-bottom:none}
.list-row .lr-ico{width:34px;height:34px;border-radius:10px;background:var(--pink-soft);display:flex;align-items:center;
  justify-content:center;font-size:17px;flex-shrink:0}
.list-row .lr-arrow{margin-left:auto;color:var(--ink-soft);font-size:16px}
.record-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.record-item:last-child{border:none}
.record-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0}
.record-ico.in{background:#eaf8f1;color:var(--green)}
.record-ico.out{background:var(--pink-soft);color:var(--pink-deep)}
.record-body{flex:1;min-width:0}
.record-body .r-t{font-size:13px;font-weight:600}
.record-body .r-d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.record-amt{font-weight:700;font-size:14px}
.record-amt.in{color:var(--green)}
.record-amt.out{color:var(--pink-deep)}

/* ============ 对话全屏独立页 ============ */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center}
.modal-mask{position:absolute;inset:0;background:rgba(60,40,55,.4);backdrop-filter:blur(3px)}
.chat-screen{position:fixed;inset:0;z-index:95;background:linear-gradient(165deg,#fdf6e8,#fff2e4 45%,#ffe9ee);display:flex;justify-content:center;
  animation:chatIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes chatIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.chat-panel{position:relative;width:100%;max-width:520px;height:100%;background:transparent;
  display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
  background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.chat-back{font-size:32px;color:var(--ink);line-height:1;width:30px;text-align:left;flex-shrink:0}
.chat-head img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:top center;background:var(--pink-soft);flex-shrink:0}
.chat-head div{display:flex;flex-direction:column;line-height:1.35}
.chat-head strong{font-size:15px}
.chat-status{font-size:12px;color:var(--green)}
.chat-voice{font-size:18px;margin-left:auto;background:var(--pink-soft);width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.chat-voice-setting{font-size:16px;background:var(--purple-soft);width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-voice:active,.chat-voice-setting:active{transform:scale(.9)}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:88%;animation:rise .3s both}
.msg.them{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:top center;background:var(--pink-soft);flex-shrink:0}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.msg.them .msg-bubble{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px}
.msg.me .msg-bubble{background:linear-gradient(120deg,var(--pink),var(--purple-deep));color:#fff;border-radius:16px 4px 16px 16px}
.chat-quick{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;flex-shrink:0}
.chat-quick button{white-space:nowrap;padding:7px 13px;border-radius:18px;background:#fff;border:1.5px solid var(--pink);
  color:var(--pink-deep);font-size:12.5px}
.chat-input-row{display:flex;gap:8px;padding:12px 16px 18px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.chat-input-row input{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;font-size:13px;outline:none;min-width:0}
.chat-input-row input:focus{border-color:var(--pink)}
.chat-input-row button{padding:0 20px;border-radius:22px;background:linear-gradient(120deg,var(--pink),var(--purple-deep));
  color:#fff;font-weight:700;font-size:13px}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:rgba(74,59,71,.92);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;
  opacity:0;pointer-events:none;transition:.3s;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 扭蛋结果 ============ */
.gacha-result{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,55,.5);backdrop-filter:blur(4px)}
.result-card{width:min(300px,84vw);background:#fff;border-radius:26px;padding:28px 20px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.result-card .r-emoji{font-size:70px;display:block;margin-bottom:10px;animation:bob 2s ease-in-out infinite}
.result-card h3{font-size:20px;margin:0 0 6px;color:var(--pink-deep)}
.result-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px}
.result-card .btn-primary{width:100%}

/* ============ 自定义弹窗 ============ */
.dialog-panel{position:relative;z-index:2;width:min(360px,88vw);background:#fff;border-radius:24px;
  padding:26px 22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.2);text-align:center;
  animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.dialog-emoji{font-size:44px;display:block;margin-bottom:8px}
.dialog-title{font-size:17px;margin:0 0 6px;color:var(--ink)}
.dialog-desc{font-size:12px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6}
.dialog-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;text-align:left}
.dialog-field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft)}
.dialog-field input{border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;
  outline:none;transition:.2s;color:var(--ink)}
.dialog-field input:focus{border-color:var(--pink)}
.dialog-field input.bad{border-color:var(--red,#e24b4a);background:#fff5f5}
.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.emoji-picker .ep-label{font-size:12.5px;color:var(--ink-soft);width:100%;margin-bottom:2px}
.ep-item{width:38px;height:38px;border-radius:10px;background:#fff;border:1.5px solid var(--line);
  font-size:20px;display:flex;align-items:center;justify-content:center;transition:.2s}
.ep-item.sel{border-color:var(--pink);background:var(--pink-soft);transform:scale(1.08)}
.dialog-actions{display:flex;gap:10px}
.dialog-cancel,.dialog-ok{flex:1;padding:12px;border-radius:24px;font-size:14px;font-weight:700;transition:.2s}
.dialog-cancel{background:#f5f0f4;color:var(--ink-soft)}
.dialog-ok{background:linear-gradient(120deg,var(--pink),var(--purple-deep));color:#fff;
  box-shadow:0 6px 16px rgba(180,120,190,.28)}

/* ============ 月卡卡 ============ */
.month-card{display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(120deg,#fff3d6,#ffe9c9);border-color:#f5d99b;transition:.2s}
.month-card:active{transform:scale(.985)}
.month-glow{font-size:34px;filter:drop-shadow(0 2px 4px rgba(200,150,60,.4));flex-shrink:0}
.month-body{flex:1;min-width:0}
.month-tag{display:inline-block;font-size:12px;color:#a86b00;background:#fff5dc;border:1px solid #f0cf8a;
  padding:2px 8px;border-radius:10px;margin-bottom:5px}
.month-title{font-size:14px;font-weight:700;color:#8a5a00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-desc{font-size:12.5px;color:#b1833f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-price{font-size:13px;font-weight:700;color:#a86b00;flex-shrink:0}

/* ============ 商城 ============ */
.shop-tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:5px;margin-bottom:14px;box-shadow:var(--shadow)}
.shop-tab{flex:1;padding:10px 4px;border-radius:12px;font-size:12.5px;color:var(--ink-soft);transition:.2s;font-weight:600}
.shop-tab.active{background:linear-gradient(120deg,var(--pink),var(--purple-deep));color:#fff;
  box-shadow:0 4px 12px rgba(180,120,190,.3)}
.gacha-ten{width:100%;margin-top:10px;padding:11px;border-radius:14px;background:var(--purple-soft);
  color:var(--purple-deep);font-weight:700;font-size:13px;border:1.5px dashed var(--purple)}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop-item{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:8px 6px 10px;
  text-align:center;transition:.2s;position:relative;overflow:hidden}
.shop-item:active{transform:scale(.96)}
.shop-item.owned{border-color:var(--green)}
.si-preview{height:80px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:46px;position:relative;margin-bottom:8px}
.si-owned{position:absolute;bottom:4px;left:4px;right:4px;font-size:9px;color:#fff;background:var(--green);
  border-radius:8px;padding:2px 0}
.si-sparkle{position:absolute;top:4px;right:6px;font-size:14px;animation:bob 2s infinite}
.si-name{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-meta{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;font-size:12px;color:var(--ink-soft)}
.rarity-badge{font-size:9px;font-weight:700;border:1px solid;border-radius:5px;padding:0 4px;line-height:14px}
.si-price{color:#1aa4d6;font-weight:700}
.shop-banner{background:linear-gradient(135deg,#e6f6ff,#f0e8ff);border:1px solid #d9e9f7;border-radius:18px;
  padding:18px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow)}
.sb-title{font-size:17px;font-weight:700;color:#1a7fb0}
.sb-desc{font-size:12.5px;color:#5a7180;margin:6px 0 12px;line-height:1.6}
.sb-desc b{color:#1aa4d6}
.sb-recharge{background:linear-gradient(120deg,#29b6e8,#1a90c8);color:#fff;padding:10px 26px;
  border-radius:22px;font-weight:700;font-size:13px;box-shadow:0 6px 14px rgba(40,160,210,.3)}
.theme-banner{background:linear-gradient(135deg,#fff0f6,#f0eaff)}
.theme-banner .sb-title{color:var(--pink-deep)}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.theme-item{border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px;text-align:center;transition:.2s}
.theme-item.active{border-color:var(--pink);box-shadow:0 6px 16px rgba(244,143,177,.3)}
.theme-preview{height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:40px;position:relative;box-shadow:inset 0 -18px 24px rgba(0,0,0,.12)}
.theme-active{position:absolute;bottom:5px;left:5px;right:5px;font-size:9px;color:#fff;background:var(--pink-deep);
  border-radius:8px;padding:2px 0}
.theme-name{font-size:13px;font-weight:700;margin-top:8px}
.theme-price{font-size:12.5px;color:var(--purple-deep);margin-top:3px}

/* ============ 商品详情 / 充值弹窗 ============ */
.item-panel{position:relative;z-index:2;width:min(380px,90vw);max-height:86vh;overflow-y:auto;background:#fff;
  border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.item-close{position:absolute;top:12px;right:14px;font-size:24px;color:#fff;z-index:3;
  text-shadow:0 1px 3px rgba(0,0,0,.3);line-height:1}
.item-hero-preview{height:200px;display:flex;align-items:center;justify-content:center;position:relative;
  border-radius:24px 24px 0 0}
.item-hero-emoji{font-size:110px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}
.item-hero-sparkle{position:absolute;top:20px;left:0;right:0;text-align:center;color:#a86b00;font-weight:700;
  font-size:14px;letter-spacing:3px}
.item-info{padding:20px}
.item-title-row{display:flex;align-items:center;gap:10px}
.item-title-row h3{margin:0;font-size:19px;color:var(--ink)}
.item-type{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.item-desc{font-size:13px;color:var(--ink-soft);line-height:1.7;margin:12px 0 18px}
.item-price{text-align:center;font-size:20px;font-weight:700;color:#1aa4d6;margin-bottom:12px}
.item-price span{font-size:12px;color:var(--ink-soft);font-weight:400}
.item-recharge{width:100%;margin-top:10px;padding:11px;border-radius:24px;background:var(--purple-soft);
  color:var(--purple-deep);font-weight:700}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
/* 十连结果 */
.result-card.multi{width:min(360px,90vw)}
.result-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.result-mini{border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;
  animation:moodPop .4s both;font-size:26px}
.rm-name{font-size:9px;color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.result-tip{font-size:12px;color:var(--purple-deep);margin:8px 0 16px}
/* 充值 */
.recharge-head{text-align:center;padding:24px 20px 8px}
.rh-icon{font-size:46px}
.recharge-head h3{margin:6px 0;font-size:19px;color:var(--ink)}
.recharge-head p{margin:0;font-size:12px;color:var(--ink-soft)}
.recharge-tiers{display:flex;gap:10px;padding:18px;justify-content:center}
.recharge-tier{flex:1;border:2px solid var(--line);border-radius:16px;background:#f9fbfd;padding:16px 6px;
  position:relative;transition:.2s}
.recharge-tier.hot{border-color:#29b6e8;background:#eef9ff}
.recharge-tier:active{transform:scale(.96)}
.rt-hot{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:9px;color:#fff;
  background:#29b6e8;padding:2px 8px;border-radius:8px;white-space:nowrap}
.rt-diamond{font-size:16px;font-weight:700;color:#1aa4d6}
.rt-diamond span{font-size:12px;color:#e06a00}
.rt-price{font-size:14px;font-weight:700;margin-top:6px;color:var(--ink)}
.recharge-note{font-size:12px;color:var(--ink-soft);text-align:center;padding:0 20px 20px;line-height:1.6;
  border-top:1px dashed var(--line);margin-top:4px;padding-top:14px}

/* ============ 商城品类分层 ============ */
.category-list{display:flex;flex-direction:column;gap:10px}
.category-card{display:flex;align-items:center;gap:13px;width:100%;padding:13px;border-radius:16px;
  background:linear-gradient(120deg,#fff6fa,#f7f1ff);border:1.5px solid var(--line);text-align:left;transition:.2s}
.category-card:active{transform:scale(.985)}
.cat-emoji{width:52px;height:52px;border-radius:15px;background:#fff;display:flex;align-items:center;
  justify-content:center;font-size:30px;flex-shrink:0;box-shadow:var(--shadow)}
.cat-body{flex:1;min-width:0}
.cat-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-count{font-size:12px;color:var(--purple-deep);background:var(--purple-soft);padding:2px 8px;border-radius:10px;font-weight:400}
.cat-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.cat-progress{font-size:12px;color:var(--green);margin-top:4px}
.cat-arrow{font-size:26px;color:var(--ink-soft);flex-shrink:0}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--purple-deep);
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.cat-tip{font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px}

/* ============ 语音选择器 ============ */
.voice-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}
.voice-row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:14px;
  background:#faf7fb;border:1.5px solid var(--line);text-align:left;transition:.2s}
.voice-row.sel{border-color:var(--pink);background:var(--pink-soft)}
.vr-ico{font-size:22px;flex-shrink:0}
.vr-name{flex:1;font-size:12.5px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr-name em{font-style:normal;font-size:12px;color:var(--purple-deep);background:var(--purple-soft);
  padding:1px 6px;border-radius:8px;margin-left:4px}
.vr-try{font-size:12.5px;color:var(--pink-deep);border:1.5px solid var(--pink);border-radius:14px;
  padding:5px 11px;flex-shrink:0}

/* ============ 角色装扮穿戴 + 生动动画 ============ */
.char-visual{position:relative;display:inline-block;width:100%;height:100%;transform-origin:bottom center}
/* 待机：呼吸(scaleY微变) + 轻微摇摆，比单纯上下浮动更活 */
.char-visual.idle-bob{animation:idleAlive 3.6s ease-in-out infinite}
@keyframes idleAlive{
  0%,100%{transform:translateY(0) scaleY(1) rotate(0)}
  25%{transform:translateY(-4px) scaleY(1.015) rotate(-1.2deg)}
  50%{transform:translateY(-8px) scaleY(.99) rotate(0)}
  75%{transform:translateY(-4px) scaleY(1.015) rotate(1.2deg)}
}
/* 角色自身图片不再单独bob，统一由容器驱动，避免动画叠加 */
.hero-char img,.room-char{animation:none!important}
/* 眨眼：两条短线在眼睛位置快速闭合（位置由 --blink-top 控制） */
.char-blink{position:absolute;top:var(--blink-top,26%);left:50%;transform:translateX(-50%);
  width:34%;height:0;z-index:8;pointer-events:none;display:flex;justify-content:space-around}
.char-blink::before,.char-blink::after{content:"";width:22%;height:3px;border-radius:3px;background:rgba(80,55,70,.75);
  transform:scaleY(0);transform-origin:center;animation:blink 5.2s infinite}
.char-blink::before{animation-delay:0s}
.char-blink::after{animation-delay:.06s}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
/* 点击互动：跳一下 */
.char-visual.happy{animation:charHappy .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes charHappy{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.06) rotate(-5deg)}60%{transform:translateY(-6px) scale(1.02) rotate(4deg)}}
/* 点击飘出的小心心/星星 */
.char-float{position:absolute;top:20%;left:50%;font-size:20px;z-index:12;pointer-events:none;
  animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1.3)}}
.char-accessory{position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:30px;z-index:9;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));animation:bob 2.5s ease-in-out infinite;pointer-events:none}
.hero-char .char-accessory{top:6%;font-size:34px}
.room-char-wrap .char-accessory{top:-4%;font-size:36px}
.wear-tip{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:8px;line-height:1.5}

/* ============ 审批单卡片（wavefox 风格） ============ */
.approval-form-msg{align-self:flex-start;max-width:92%;margin:6px 0 8px;animation:formIn .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes formIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.approval-form{background:#fff;border-radius:14px;padding:13px 15px;box-shadow:0 6px 18px rgba(180,120,80,.12);
  border:1px solid #f3e6d8;position:relative;overflow:hidden}
.af-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f5ece2;padding-bottom:8px;margin-bottom:10px}
.af-title{font-size:12.5px;font-weight:700;color:#8a6b5a}
.af-no{font-size:9.5px;color:#bda99a;letter-spacing:.5px}
.af-body{display:flex;align-items:center;gap:10px;min-height:52px}
.af-left{flex:1;min-width:0}
.af-item{font-size:15px;font-weight:700;color:#5a4a42;margin-bottom:5px}
.af-opinion{font-size:12px;color:#9a8a80;line-height:1.5;padding-right:8px}
.af-amount{font-size:24px;font-weight:700;color:#e0553f;white-space:nowrap;flex-shrink:0}
.af-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px dashed #f0e4d8;
  font-size:9px;color:#bda99a;position:relative;min-height:30px}
.af-stamp{position:absolute;right:2px;top:-24px;width:74px;height:74px;border:3px solid #d9342b;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#d9342b;transform:rotate(-18deg);opacity:.88;
  animation:stampDown .45s cubic-bezier(.2,1.6,.4,1) both}
.af-stamp::after{content:"";position:absolute;inset:3px;border:1.5px solid #d9342b;border-radius:50%}
.afs-text{font-size:19px;font-weight:700;letter-spacing:2px}
.af-stamp.pass{color:#c9302c;border-color:#c9302c}
.af-stamp.pass::after{border-color:#c9302c}
.af-stamp.reject{color:#c0392b;border-color:#c0392b}
.af-stamp.reject::after{border-color:#c0392b}
@keyframes stampDown{0%{transform:scale(2.4) rotate(-18deg);opacity:0}55%{transform:scale(.86) rotate(-18deg);opacity:.95}100%{transform:scale(1) rotate(-18deg);opacity:.88}}

/* ============ 存钱铃铛弹窗 ============ */
.save-bell-pop{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,55,.3);backdrop-filter:blur(3px);transition:opacity .4s}
.save-bell-pop.out{opacity:0}
.bell-card{background:linear-gradient(160deg,#fff,#fff4e6);border:2px solid #ffd98a;border-radius:24px;
  padding:24px 34px;text-align:center;box-shadow:0 20px 50px rgba(200,150,60,.35);animation:bellPop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes bellPop{0%{transform:scale(.4) translateY(20px);opacity:0}100%{transform:scale(1);opacity:1}}
.bell-coin{font-size:56px;animation:coinDrop .6s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 6px 8px rgba(200,150,40,.4))}
@keyframes coinDrop{0%{transform:translateY(-30px) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.bell-ding{font-size:18px;color:var(--gold);font-weight:700;margin-top:2px}
.bell-amount{font-size:22px;font-weight:700;color:var(--ink);margin-top:6px}
.bell-stars{font-size:14px;color:var(--pink-deep);font-weight:700;margin-top:6px}
.bell-sparkles{font-size:13px;color:var(--gold);margin-top:10px;letter-spacing:4px;animation:bob 1.5s infinite}

/* ============ 成就徽章 ============ */
.achievement-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ach-badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;
  background:#f7f5f8;border:1.5px solid var(--line);opacity:.55}
.ach-badge.got{background:linear-gradient(160deg,#fff6dc,#ffe9c9);border-color:#f0cf8a;opacity:1;
  box-shadow:0 4px 12px rgba(220,170,70,.2)}
.ab-emoji{font-size:28px}
.ach-badge.got .ab-emoji{filter:drop-shadow(0 2px 4px rgba(200,150,50,.4))}
.ab-name{font-size:12px;color:var(--ink);text-align:center}
.achievement-pop{position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,55,.4);backdrop-filter:blur(3px)}
.ach-card{width:min(300px,84vw);background:#fff;border-radius:24px;padding:26px 22px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);animation:bellPop .5s cubic-bezier(.2,1.5,.4,1)}
.ach-glow{font-size:64px;filter:drop-shadow(0 6px 10px rgba(220,170,60,.5));animation:bob 2s infinite}
.ach-label{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:3px;margin-top:6px}
.ach-name{font-size:21px;font-weight:700;color:var(--ink);margin-top:4px}
.ach-desc{font-size:12.5px;color:var(--ink-soft);margin-top:6px}

/* ============ 音乐选择器 / 语音风格 ============ */
.music-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
  font-size:13.5px;color:var(--ink)}
.switch{width:48px;height:28px;border-radius:16px;background:#ddd;position:relative;transition:.2s}
.switch.on{background:linear-gradient(120deg,var(--pink),var(--purple-deep))}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on span{left:23px}
.music-list{padding:6px 16px 16px;display:flex;flex-direction:column;gap:8px}
.music-track{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;
  background:#faf7fb;border:1.5px solid var(--line);text-align:left;transition:.2s}
.music-track.sel{border-color:var(--pink);background:var(--pink-soft)}
.mt-emoji{font-size:24px}
.mt-name{flex:1;font-size:13.5px;color:var(--ink)}
.mt-name em{font-style:normal;font-size:12px;color:var(--pink-deep);background:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
.mt-check{color:var(--pink-deep);font-weight:700}
.voice-style-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 16px 4px}
.vs-label{font-size:12.5px;color:var(--ink-soft);width:100%}
.style-chip{font-size:12.5px;padding:6px 12px;border-radius:16px;background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
.style-chip.sel{border-color:var(--purple-deep);background:var(--purple-soft);color:var(--purple-deep);font-weight:700}

/* ============ 支付宝支付表单容器 ============ */
.pay-form-host{position:fixed;inset:0;z-index:9999;background:#fff}

/* ============ 桌面适配：宽屏双栏，避免手机稿留白 ============ */
.desktop-aside{display:none}
@media(min-width:900px){
  body{background:radial-gradient(circle at 18% 20%,#ffe3ef 0,transparent 38%),
                  radial-gradient(circle at 82% 78%,#e9ddff 0,transparent 40%),
                  linear-gradient(160deg,#fff7fb,#f5efff)}
  .desktop-aside{display:flex;position:fixed;top:0;bottom:0;width:calc((100vw - 520px)/2);
    flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;pointer-events:none}
  .desktop-left{left:0}
  .desktop-right{right:0;gap:18px}
  .da-logo{font-size:72px;filter:drop-shadow(0 10px 16px rgba(200,120,160,.3))}
  .desktop-left h1{font-size:34px;color:var(--pink-deep);margin:14px 0 8px}
  .da-slogan{font-size:18px;color:var(--ink);line-height:1.7;margin:0 0 28px;font-weight:600}
  .da-steps{text-align:left;font-size:14px;color:var(--ink-soft);line-height:2.4}
  .da-steps span{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--pink-deep);color:#fff;
    align-items:center;justify-content:center;font-size:12px;margin-right:8px}
  .da-note{margin-top:30px;font-size:13px;color:var(--purple-deep);background:#fff9;border-radius:20px;padding:8px 16px}
  .da-deco{font-size:46px;opacity:.75}
  .desktop-right p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-top:20px}
  .app{max-width:520px;border-radius:28px;background:#fffaf6;box-shadow:0 24px 70px rgba(120,70,110,.22);
    margin:22px auto;min-height:calc(100vh - 44px);border:1px solid #f3e6ee}
  .bottom-nav{max-width:520px;border-radius:0 0 28px 28px}
  .chat-screen{max-width:520px;margin:0 auto;border-radius:28px;overflow:hidden;inset:22px auto}
}

/* 响应式 */
@media(max-width:380px){
  .quick-grid{gap:6px}
  .topbar-greet strong{font-size:12px}
  .topbar-right{gap:6px}
  .coin-badge{padding:5px 9px;font-size:12px}
  .shop-grid{grid-template-columns:repeat(3,1fr);gap:7px}
  .si-preview{height:66px;font-size:38px}
  .room-scene{height:270px}
  .room-char{height:150px}
  .char-mood{bottom:158px}
  .result-grid{grid-template-columns:repeat(3,1fr)}
}

<script>

<script>
/* ============================================================
   钱搭子 - 完整可交互原型
   数据全部保存在浏览器 localStorage，刷新不丢失
   ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

/* ---------- 数据层 ---------- */
const DEFAULT_STATE = {
  char: null,            // 'girl' | 'bunny'
  star: 30,              // 星星（扭蛋货币，存钱获得）
  diamond: 0,            // 钻石（付费货币，充值获得）
  totalSaved: 0,         // 累计存钱
  goals: [],             // {id,name,emoji,target,saved}
  activeGoal: null,      // 当前选中的存钱目标 id（存钱存进它）
  records: [],           // {id,type:'in'|'out',amount,name,time}
  inventory: [],         // 已拥有的家具/装扮/皮肤 id
  placed: [],            // 已摆放到小家的 [{id,x,y}]
  approved: [],          // 审批通过的商品名
  theme: 'sweet',        // 房间主题 id
  equipped: { skin:null, accessory:null }, // 当前穿戴的皮肤/装扮 id
  streak: 0,             // 连续存钱天数
  guideDone: false,      // 是否看过首次引导
  firstUseDate: '',      // 首次使用日期（算"第N天"用）
  lastSaveDate: '',      // 上次存钱日期
  achievements: [],      // 已解锁成就 id
  voiceOn: true,         // 角色语音开关
  voiceURI: '',          // 用户选择的中文语音（空=自动优选）
  voiceStyle: 'natural', // natural | gentle | lively
  monthly: false,        // 月卡
  musicOn: false,
  musicTrack: 0,         // 背景音乐曲目索引
  name: '存钱小当家'
};
let state = load();

function load() {
  try {
    const raw = localStorage.getItem('taotao_state');
    if (raw) {
      const s = { ...DEFAULT_STATE, ...JSON.parse(raw) };
      // 迁移旧版 placed: ['id'] -> [{id,x,y}]
      if (s.placed.length && typeof s.placed[0] === 'string') {
        const defaults = { sofa:[18,60], lamp:[74,58], plant:[8,62], tv:[80,52], carpet:[42,78], books:[62,60], lamp2:[90,54] };
        s.placed = s.placed.map(id => ({ id, x: (defaults[id] || [50,70])[0], y: (defaults[id] || [50,70])[1] }));
      }
      return s;
    }
  } catch (e) {}
  return { ...DEFAULT_STATE };
}
function save() {
  localStorage.setItem('taotao_state', JSON.stringify(state));
}
/* 数据导出/导入备份 */
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `钱搭子备份_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('备份已导出到下载文件夹');
  } catch(e) { toast('导出失败，请换个浏览器试试'); }
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== 'object' || !Array.isArray(data.goals)) throw 0;
        openDialog({
          emoji:'📥', title:'确认导入备份？',
          desc:'导入会覆盖当前所有数据（目标/星星/收藏），请先确认这是你的备份文件。',
          okText:'确认导入',
          onOk:()=>{
            state = { ...DEFAULT_STATE, ...data };
            save(); go('home'); toast('导入成功，数据已恢复！');
          }
        });
      } catch(e) { toast('文件格式不对，请选择本应用导出的备份'); }
    };
    reader.readAsText(f);
  };
  inp.click();
}
function reset() {
  localStorage.removeItem('taotao_state');
  state = { ...DEFAULT_STATE };
  location.reload();
}

/* ============================================================
   角色系统（数据驱动，方便后续扩展更多角色）
   新增角色：在 CHARACTERS 加一条 + 在 assets-inline.js 加 IMG.<id> 即可，
   所有功能（换装/动画/语音/审批/商城/小家）自动同步，无需改逻辑。
   ============================================================ */

  if (!visual) return;
  const moods = charMoods();
  const msg = moods[Math.floor(Math.random() * moods.length)];
  // 气泡（若在小家）
  const mood = $('#charMood');
  if (mood && visual.closest('#roomChar')) {
    mood.textContent = msg;
    mood.classList.remove('pop'); void mood.offsetWidth; mood.classList.add('pop');
  } else { toast(`${getCharName()}：${msg}`); }
  // 跳一下
  visual.classList.remove('happy'); void visual.offsetWidth; visual.classList.add('happy');
  setTimeout(()=>visual.classList.remove('happy'), 700);
  // 飘出 emoji
  const emojis = (getChar().floatEmojis) || ['💗','✨'];
  for (let i=0;i<3;i++) {
    const f = document.createElement('span');
    f.className='char-float';
    f.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    f.style.left = (40 + Math.random()*20) + '%';
    f.style.top = (15 + Math.random()*10) + '%';
    f.style.animationDelay = (i*0.12)+'s';
    visual.appendChild(f);
    setTimeout(()=>f.remove(), 1300);
  }
  if (state.voiceOn) speak(msg);
}

/* ---------- 工具 ---------- */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 自定义弹窗（替代原生 prompt/confirm，沙箱可用） ----------
   openDialog({emoji,title,desc,fields:[{key,label,value,placeholder,type}],okText,onOk})
   onOk(values) 返回 false 则不关闭
*/
function openDialog(opt) {
  const modal = $('#dialogModal');
  $('#dialogEmoji').textContent = opt.emoji || '✨';
  $('#dialogTitle').textContent = opt.title || '';
  $('#dialogDesc').textContent = opt.desc || '';
  const fields = opt.fields || [];
  $('#dialogFields').innerHTML = fields.map(f => `
    <label class="dialog-field">
      <span>${esc(f.label)}</span>
      <input id="df_${f.key}" type="${f.type || 'text'}" value="${esc(f.value != null ? f.value : '')}"
        placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'inputmode="numeric"' : ''}>
    </label>`).join('');
  $('#dialogOk').textContent = opt.okText || '确定';
  const cleanup = () => {
    modal.classList.add('hidden');
    $('#dialogOk').onclick = null;
    $('#dialogCancel').onclick = null;
  };
  $('#dialogCancel').onclick = cleanup;
  $('[data-close="dialog"]').onclick = cleanup;
  $('#dialogOk').onclick = () => {
    const values = {};
    let valid = true;
    fields.forEach(f => {
      const el = $('#df_' + f.key);
      values[f.key] = el.value.trim();
      if (f.required && !values[f.key]) { valid = false; el.classList.add('bad'); }
    });
    if (!valid) { toast('请把内容填完整哦～'); return; }
    const r = opt.onOk ? opt.onOk(values) : true;
    if (r !== false) cleanup();
  };
  modal.classList.remove('hidden');
  setTimeout(() => { const first = $('#dialogFields input'); if (first) first.focus(); }, 100);
}
function fmt(n) { return '¥' + Number(n).toLocaleString('zh-CN'); }
function nowStr() {
  const d = new Date();
  return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function greeting() {
  const h = new Date().getHours();
  if (h < 6) return '夜深啦';
  if (h < 11) return '早安呀';
  if (h < 14) return '中午好';
  if (h < 18) return '下午好';
  return '晚上好';
}
function uid() { return Date.now() + Math.floor(Math.random() * 1000); }
/* XSS 防护：所有用户输入的文本进 innerHTML 前必须 escape */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* 首次使用到第几天（按自然日算，不是流水条数） */
function usedDays() {
  if (!state.firstUseDate) {
    state.firstUseDate = new Date().toDateString();
    save();
    return 1;
  }
  const start = new Date(state.firstUseDate);
  const today = new Date();
  const diff = Math.floor((today - start) / 86400000);
  return Math.max(1, diff + 1);
}
/* 今日存入金额 */
function todaySaved() {
  const t = new Date().toDateString();
  return state.records.filter(r => r.type === 'in' && r.dateKey === t)
    .reduce((s, r) => s + r.amount, 0);
}

function initSplash() {
  const fill = $('#loadingFill');
  const pct = $('#loadingPct');
  const txt = $('#loadingText');
  const splash = $('#splash');
  const phases = ['正在打开存钱屋', '桃桃正在整理存钱罐', '准备你的小家', '马上就好啦～'];
  let p = 0;
  const timer = setInterval(() => {
    p += Math.floor(Math.random() * 12) + 6;
    if (p > 100) p = 100;
    fill.style.width = p + '%';
    pct.textContent = p + '%';
    txt.textContent = phases[Math.min(phases.length - 1, Math.floor(p / 26))];
    if (p >= 100) {
      clearInterval(timer);
      setTimeout(() => {
        splash.classList.add('out');
        setTimeout(() => {
          splash.style.display = 'none';
          if (!state.char) showSetup();
          else showApp();
        }, 600);
      }, 350);
    }
  }, 230);
}

  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5 };
function freq(n){ if(n.includes('=')) return parseFloat(n.split('=')[1]); return NOTE[n]||523.25; }
/* 3首曲子：旋律(音名,拍) + 和弦进行 + 速度 + 音色 */
const TRACKS = [
  { name:'甜蜜小屋', emoji:'🎀', beat:0.40, wave:'triangle', vol:0.14,
    melody:[['C5',1],['E5',1],['G5',1],['E5',0.5],['D5',0.5],['C5',1],['D5',1],['E5',1],['C5',1],
            ['G4',1],['C5',1],['E5',1],['D5',0.5],['E5',0.5],['G5',1],['E5',1],['C5',2]],
    chords:[['C4','E4','G4'],['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4']] },
  { name:'星光圆舞曲', emoji:'✨', beat:0.5, wave:'sine', vol:0.15,
    melody:[['E5',1],['G5',0.5],['A5',0.5],['G5',1],['E5',1],['D5',1],
            ['C5',1],['E5',1],['G5',0.5],['E5',0.5],['D5',2],
            ['C5',0.5],['D5',0.5],['E5',1],['G5',1],['A5',1],['G5',2]],
    chords:[['C4','E4','G4'],['G3','B3','D4'],['A3','C4','E4'],['F3','A3','C4']] },
  { name:'午后小憩', emoji:'🌿', beat:0.62, wave:'sine', vol:0.13,
    melody:[['G4',1],['C5',1],['D5',1],['E5',1],['D5',1],['C5',1],['A4',2],
            ['G4',1],['A4',1],['C5',1],['D5',1],['C5',1],['A4',1],['G4',2]],
    chords:[['C4','E4','G4'],['F3','A3','C4'],['G3','B3','D4'],['C4','E4','G4']] }
];
/* 通用音符：柔和起音 + 自然衰减 + 高八度泛音 */
function playNote(hz, time, dur, vol, wave, dest) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = wave || 'sine'; o.frequency.value = hz;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur);
  o.connect(g); g.connect(dest);
  o.start(time); o.stop(time+dur+0.03);
  const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
  o2.type='sine'; o2.frequency.value=hz*2;
  g2.gain.setValueAtTime(0.0001,time);
  g2.gain.linearRampToValueAtTime(vol*0.22,time+0.015);
  g2.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.5);
  o2.connect(g2); g2.connect(dest);
  o2.start(time); o2.stop(time+dur+0.03);
}
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function toggleMusic(force) {
  state.musicOn = force === undefined ? !state.musicOn : force;
  save(); updateMusicUI();
  if (state.musicOn) startMusic(); else stopMusic();
}
function startMusic() {
  try {
    ensureAudio();
    stopMusic();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);
    const track = TRACKS[state.musicTrack] || TRACKS[0];
    let t = audioCtx.currentTime + 0.08;
    const scheduleLoop = () => {
      if (!state.musicOn) return;
      const startT = t;
      track.melody.forEach(([note,len]) => {
        playNote(freq(note), t, len*track.beat*0.9, track.vol, track.wave, masterGain);
        t += len*track.beat;
      });
      let ct = startT; const chLen = 2*track.beat;
      track.chords.forEach(ch => {
        ch.forEach(c => playNote(freq(c), ct, chLen*0.9, track.vol*0.28, 'sine', masterGain));
        ct += chLen;
      });
      musicTimer = setTimeout(scheduleLoop, Math.max(100,(t-audioCtx.currentTime-0.2)*1000));
    };
    scheduleLoop();
  } catch (e) { state.musicOn = false; save(); updateMusicUI(); }
}
function stopMusic() {
  clearTimeout(musicTimer); musicTimer = null;
  if (masterGain) { try{masterGain.disconnect();}catch(e){} masterGain=null; }
}
function selectTrack(i) {
  state.musicTrack = i; save();
  if (state.musicOn) startMusic();
  toast(`已切换：${TRACKS[i].emoji} ${TRACKS[i].name}`);
}
/* 清脆铃铛音（存钱/开屏等） */
function playBell() {
  try {
    ensureAudio();
    const t = audioCtx.currentTime;
    const dest = audioCtx.destination;
    // 铃铛：基频 + 非整数泛音，快速起音、较长衰减
    const base = 1046.5; // C6
    [[1,0.13],[2.02,0.07],[3.01,0.04],[4.15,0.02]].forEach(([mul,v]) => {
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=base*mul;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(v,t+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.9/mul);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t+1);
    });
  } catch(e) {}
}
function updateMusicUI() {
  const b = $('#musicBtn'), s = $('#splashSound'), l = $('#soundLabel');
  if (b) b.classList.toggle('off', !state.musicOn);
  if (s) s.classList.toggle('playing', state.musicOn);
  if (l) l.textContent = state.musicOn ? `音乐：${TRACKS[state.musicTrack].name} ♪` : '开启音乐';
}

  panel.innerHTML = `

    <div class="music-list">${tracks}</div>
    <div class="recharge-note">音乐为程序实时合成，无需下载，不消耗流量。</div>`;
  modal.classList.remove('hidden');
  $$('[data-close="item"]').forEach(el => el.onclick = closeItem);
  $('#musicSwitch').onclick = () => { toggleMusic(); openMusicPicker(); };

}

function activeGoal() {
  if (!state.goals.length) return null;
  const cur = state.goals.find(g => g.id === state.activeGoal && !g.done);
  if (cur) return cur;
  const next = state.goals.find(g => !g.done);
  if (next) { state.activeGoal = next.id; return next; }
  return state.goals[0]; // 全完成了，返回第一个用于展示
}

  const cur = activeGoal();
  const pct = cur ? Math.min(100, cur.saved / cur.target * 100) : 0;
  const remain = cur ? Math.max(0, cur.target - cur.saved) : 0;
  const done = cur && cur.saved >= cur.target;

    ? state.goals.map(g => {
        const sel = cur && g.id === cur.id;

/* 小家交互：点击角色、拖拽家具、点击/双击家具 */
function bindRoom() {
  const scene = $('#roomScene');
  if (!scene) return;

  // 点击角色互动
  const charWrap = $('#roomChar');
  if (charWrap) charWrap.addEventListener('click', () => charInteract(charWrap.querySelector('.char-visual')));

  // 家具箱点击：放入房间中央附近
  $$('[data-inv]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.inv;
    if (state.placed.some(p => p.id === id)) { toast('这件已经在房间里啦，拖动它换个位置吧～'); return; }
    const it = findItem(id);
    const nx = 30 + Math.random() * 40, ny = 62 + Math.random() * 12;
    state.placed.push({ id, x: nx, y: ny });
    save(); go('room');
    toast(`已把「${it.name}」摆进小家，拖动它换个位置吧～`);
  }));

  const th = $('#themeSwitchHint'); if (th) th.addEventListener('click', () => { shopTab='theme'; go('gacha'); });

  // 房间内家具：拖拽 + 双击收起
  let dragging = null;
  const items = $$('.placed-item', scene);
  items.forEach(item => {
    let moved = false;
    const startDrag = (clientX, clientY) => {
      dragging = item; moved = false;
      item.classList.add('dragging');
      item._dragOffset = { x: clientX, y: clientY };
    };
    const onDrag = (clientX, clientY) => {
      if (dragging !== item) return;
      const rect = scene.getBoundingClientRect();
      let x = (clientX - rect.left) / rect.width * 100;
      let y = (clientY - rect.top) / rect.height * 100;
      x = Math.max(6, Math.min(92, x));
      y = Math.max(12, Math.min(92, y));
      item.style.left = x + '%'; item.style.top = y + '%';
      item._lastPos = { x, y };
      if (Math.abs(clientX - item._dragOffset.x) + Math.abs(clientY - item._dragOffset.y) > 6) moved = true;
    };
    const endDrag = () => {
      if (dragging !== item) return;
      item.classList.remove('dragging');
      if (moved && item._lastPos) {
        const p = state.placed.find(p => p.id === item.dataset.placeid);
        if (p) { p.x = item._lastPos.x; p.y = item._lastPos.y; save(); }
      }
      dragging = null;
    };
    item.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
    item.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener('mousemove', e => onDrag(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { if (dragging === item) onDrag(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);
    item.addEventListener('dblclick', () => {
      const id = item.dataset.placeid;
      state.placed = state.placed.filter(p => p.id !== id);
      save(); go('room'); toast('已收起家具');
    });
  });
}

    }));
    // 目标操作：编辑/完成/删除
    $$('.g-act').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.id);

      else if (act === 'finish') finishGoal(id);

  if (page === 'gacha') {

  }

  if (page === 'room') {
    bindRoom();
  }

  if (page === 'me') {
    $$('.list-row').forEach(r => r.addEventListener('click', () => {
      const a = r.dataset.act;
      if (a === 'switch-char') switchChar();
      else if (a === 'rename') rename();

          okText: '确认清空',
          onOk: () => { reset(); }
        });
      }
    }));
  }

  { id:'first',   emoji:'🌱', name:'第一步',   desc:'完成第一次存钱' },
  { id:'streak3', emoji:'🔥', name:'坚持三天', desc:'连续存钱3天' },

  { id:'collector',emoji:'🎁', name:'收藏家',   desc:'收集10件扭蛋' },

];
function checkAchievements() {
  const got = [];
  const unlock = id => { if (!state.achievements.includes(id)) { state.achievements.push(id); got.push(id); } };
  if (state.totalSaved >= 1) unlock('first');
  if (state.totalSaved >= 100) unlock('save100');
  if (state.totalSaved >= 500) unlock('save500');
  if (state.streak >= 3) unlock('streak3');
  if (state.approved.length >= 1) unlock('approve');
  if (state.inventory.length >= 10) unlock('collector');
  if (state.placed.length >= 5) unlock('decorate');
  if (got.length) {
    save();
    setTimeout(() => {
      const a = ACHIEVEMENTS.find(x => x.id === got[0]);
      if (a) showAchievement(a);
    }, 900);
  }
}

  playBell();

function doSave() {
  const input = $('#saveInput');
  const amt = Math.round(Number(input.value));
  if (!amt || amt <= 0) { toast('请输入有效的金额哦～'); input.focus(); return; }
  if (!state.goals.length) { toast('先新建一个存钱目标吧！'); addGoal(); return; }

  // 只存进当前选中的目标
  const cur = activeGoal();
  if (cur.done) { toast('这个目标已完成啦，选中其他目标或新建一个吧～'); return; }
  const wasDone = cur.saved >= cur.target; // 本次存入前是否已达标
  cur.saved += amt;
  // 存满自动标记完成 + 庆祝
  if (!wasDone && cur.saved >= cur.target) {
    cur.done = true;
    state.star += 10;
    setTimeout(() => showAchievement({ emoji:'🏆', name:'目标达成', desc:`「${cur.name}」存满啦！` }), 1800);
  }

  state.totalSaved += amt;
  let stars = Math.max(1, Math.floor(amt / 10));
  if (state.monthly) stars *= 2; // 月卡双倍
  state.star += stars;
  const today = new Date().toDateString();
  state.records.unshift({ id: uid(), type: 'in', amount: amt, name: `存入${esc(cur.name)} · 获得${stars}★${state.monthly?' (月卡双倍)':''}`, time: nowStr(), dateKey: today, goalId: cur.id });
  // 初始化首次使用日期 + 连续存钱打卡
  if (!state.firstUseDate) state.firstUseDate = today;
  if (state.lastSaveDate !== today) {
    const yesterday = new Date(Date.now()-86400000).toDateString();
    state.streak = (state.lastSaveDate === yesterday) ? state.streak + 1 : 1;
    state.lastSaveDate = today;
  }
  save();
  renderStars(); // 立即刷新顶部星星/钻石徽章，不等刷新页面

  // 动画 + 铃铛弹窗
  const bank = $('#piggyBank');
  if (bank) { bank.classList.add('drop'); setTimeout(() => bank.classList.remove('drop'), 500); }
  showSaveBell(amt, stars);
  checkAchievements();
  setTimeout(() => go('save'), 1700);
}

function addGoal(editId) {
  const editing = editId != null ? state.goals.find(g => g.id === editId) : null;
  const tpl = GOAL_TEMPLATES[Math.floor(Math.random() * GOAL_TEMPLATES.length)];
  let pickedEmoji = editing ? editing.emoji : tpl.emoji;
  const emojiChoices = GOAL_TEMPLATES.map(g => g.emoji).filter((v, i, a) => a.indexOf(v) === i);

  openDialog({
    emoji: editing ? '✏️' : '🎯',
    title: editing ? '编辑目标' : '新建一个存钱目标',
    desc: editing ? '改名字、金额或图标都行' : '想买什么？存够了就能买啦',
    fields: [
      { key: 'name', label: '目标名称', value: editing ? editing.name : tpl.name, placeholder: '比如：新款耳机', required: true },
      { key: 'target', label: '目标金额（元）', value: String(editing ? editing.target : tpl.target), placeholder: '比如：599', type: 'number', required: true }
    ],
    okText: editing ? '保存修改' : '建好啦',

      if (editing) {

        editing.done = target <= editing.saved; // 改小金额后若已达标则标记完成
        toast(`目标「${esc(v.name)}」已更新`);
      } else {
        const newId = uid();
        state.goals.push({ id: newId, name: v.name, emoji: pickedEmoji, target, saved: 0, done:false });
        state.activeGoal = newId;
        toast(`目标「${esc(v.name)}」建好啦，开始存钱吧！`);
      }
      save(); go('save');
    }
  });

  const fields = $('#dialogFields');
  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  picker.innerHTML = '<span class="ep-label">选个图标</span>' + emojiChoices.map((e, i) =>
    `<button type="button" class="ep-item ${e === pickedEmoji ? 'sel' : ''}" data-emoji="${e}">${e}</button>`
  ).join('');
  fields.appendChild(picker);
  picker.querySelectorAll('.ep-item').forEach(b => b.addEventListener('click', () => {

  }));

/* ---------- 扭蛋（支持十连） ---------- */
function doGacha(times) {
  times = times || 1;
  const cost = times === 10 ? 90 : 10 * times;
  if (state.star < cost) { toast(`需要 ${cost} ★，你只有 ${state.star} ★，去存钱攒星星吧～`); return; }
  const machine = $('#gachaMachine');
  if (machine) machine.classList.add('shake');
  state.star -= cost;
  save();
  renderStars();
  setTimeout(() => {
    if (machine) machine.classList.remove('shake');
    const results = [];
    for (let i = 0; i < times; i++) {
      const owned = state.inventory;
      const pool = GACHA_POOL.filter(x => !owned.includes(x.id));
      const source = pool.length ? pool : GACHA_POOL;
      const item = source[Math.floor(Math.random() * source.length)];
      if (!owned.includes(item.id)) state.inventory.push(item.id);
      else { state.star += 2; } // 重复补偿2星
      results.push(item);
    }
    save();
    showGachaResult(results);
  }, 650);
}

// 支付服务地址：同源部署时留空；单独部署后端时填 http://域名:3000
const PAY_API_BASE = '';
function renderPayForm(html) {
  // pageExec 返回 HTML 表单字符串，必须渲染到 DOM 并自动提交，禁止 URL 跳转
  const box = document.createElement('div');
  box.className = 'pay-form-host';

  const form = box.querySelector('form');
  if (form) form.submit();
  else { box.remove(); toast('支付表单异常，请重试'); }
}
function queryPayResult(outTradeNo, cb) {
  fetch(PAY_API_BASE + '/api/order/' + encodeURIComponent(outTradeNo))
    .then(r => r.json()).then(d => { if (d && d.ok && d.status === 'PAID') cb(d); })
    .catch(() => {});
}
function openRecharge() {
  const modal = $('#itemModal');
  const panel = $('#itemPanel');
  const tiers = RECHARGE_TIERS.map((t,i) => `
    <button class="recharge-tier ${t.hot?'hot':''}" data-tier="${i}">
      ${t.hot?'<span class="rt-hot">热门</span>':''}
      <div class="rt-diamond">◆ ${t.diamond}${t.bonus?` <span>+${t.bonus}送</span>`:''}</div>
      <div class="rt-price">¥${t.price}</div>
    </button>`).join('');
  panel.innerHTML = `
    <button class="item-close" data-close="item">×</button>
    <div class="recharge-head">
      <div class="rh-icon">💎</div>
      <h3>充值钻石</h3>
      <p>钻石可购买商城限定商品和房间主题</p>
    </div>
    <div class="recharge-tiers">${tiers}</div>
    <div class="recharge-note">🔒 通过支付宝安全支付 · 沙箱环境测试时不扣真实资金。支付完成后钻石自动到账。</div>`;
  modal.classList.remove('hidden');
  $$('[data-close="item"]').forEach(el => el.onclick = closeItem);
  $$('.recharge-tier').forEach(b => b.onclick = () => doRecharge(RECHARGE_TIERS[Number(b.dataset.tier)]));

async function doRecharge(tier) {
  // 真实支付：调用后端下单，渲染支付宝支付表单；金额以后端为准
  const btn = $('#itemAction');
  if (btn) { btn.disabled = true; btn.textContent = '正在创建订单…'; }
  try {
    const res = await fetch(PAY_API_BASE + '/api/pay/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: tier.price, subject: `钱搭子 ${tier.diamond + tier.bonus}钻石` })
    });
    const data = await res.json();
    if (!data.ok || !data.paymentHtml) throw new Error(data.error || '下单失败');
    closeItem();
    renderPayForm(data.paymentHtml);   // 渲染并提交支付表单，跳转支付宝收银台
    // 用户完成支付后同步回跳；这里额外轮询订单状态作为兜底
    let tries = 0;
    const timer = setInterval(() => {
      queryPayResult(data.outTradeNo, (d) => {
        clearInterval(timer);
        state.diamond += d.diamonds || (tier.diamond + tier.bonus);
        save(); renderStars();
        toast(`充值成功！获得 ◆ ${d.diamonds || tier.diamond + tier.bonus}`);
      });
      if (++tries > 60) clearInterval(timer); // 最多等约 3 分钟
    }, 3000);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '立即购买'; }
    toast('支付服务暂不可用，请确认已启动支付服务（见 server/README）');
  }
}
