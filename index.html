/* ============================================================
   角色语音（Web Speech API，浏览器自带，无需 API Key）
   人物=温柔女声(音高1.15/语速0.95)，动物=俏皮童声(音高1.6/语速1.1)
   ============================================================ */
let allVoices = [], voicesReady = false;
/* 中文语音优先排序：本地 > 在线；优选女声关键词 */
function sortedVoices() {
  const zh = allVoices.filter(v => /zh|cmn/i.test(v.lang));
  const score = v => {
    let s = 0;
    if (/zh-CN|cmn-CN|zh_CN/i.test(v.lang)) s += 10;
    if (/female|女|Xiaoxiao|Yaoyao|Huihui|Tingting|Meijia|Google 普通话|Microsoft Huihui/i.test(v.name)) s += 6;
    if (/natural|neural|premium|enhanced/i.test(v.name)) s += 5;
    if (!v.localService) s += 1;
    return s;
  };
  return zh.sort((a,b) => score(b) - score(a));
}
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  const pick = () => { allVoices = window.speechSynthesis.getVoices(); voicesReady = allVoices.length > 0; };
  pick();
  window.speechSynthesis.onvoiceschanged = pick;
}
function getVoice() {
  const list = sortedVoices();
  if (!list.length) return null;
  return list.find(v => v.voiceURI === state.voiceURI) || list[0];
}
/* 把文本拆成短句，逐句朗读并在标点处自然停顿，减少机械感 */
function speak(text, opts) {
  if (!state.voiceOn || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const clean = text
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
      .replace(/[～~]/g, '，').replace(/[（）()]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const segs = clean.split(/(?<=[，。！？；,!?;])/).filter(s => s.trim());
    const voice = getVoice();
    segs.forEach((seg, i) => {
      const u = new SpeechSynthesisUtterance(seg.trim());
      u.lang = 'zh-CN';
      if (voice) u.voice = voice;
      // 接近真人的温和声线：语速放慢、音高贴近自然，减少机械感
      const vc = getChar().voice || { pitch:1.0, rate:0.92 };
      u.pitch = vc.pitch; u.rate = vc.rate;
      // 用户可通过 voiceStyle 微调：natural(默认)/gentle(更慢温柔)/lively(活泼)
      if (state.voiceStyle === 'gentle') { u.pitch = 0.95; u.rate = 0.85; }
      else if (state.voiceStyle === 'lively') { u.pitch = 1.2; u.rate = 1.05; }
      if (opts && opts.pitch) u.pitch = opts.pitch;
      if (opts && opts.rate) u.rate = opts.rate;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    });
  } catch (e) {}
}
function updateVoiceBtn() {
  const b = $('#chatVoiceBtn'); if (b) b.textContent = state.voiceOn ? '🔊' : '🔇';
}
/* 语音试听/选择弹窗 */
function openVoicePicker() {
  const list = sortedVoices();
  const modal = $('#itemModal');
  const panel = $('#itemPanel');
  const rows = list.length ? list.map((v, i) => {
    const sel = (state.voiceURI ? v.voiceURI === state.voiceURI : i === 0);
    const female = /female|女|Xiaoxiao|Yaoyao|Huihui|Tingting|Meijia/i.test(v.name);
    return `<button class="voice-row ${sel?'sel':''}" data-voice="${encodeURIComponent(v.voiceURI)}">
      <span class="vr-ico">${female?'👩':'🧑'}</span>
      <span class="vr-name">${v.name}${/natural|neural|premium/i.test(v.name)?' <em>自然</em>':''}</span>
      <span class="vr-try">试听</span>
    </button>`;
  }).join('') : '<div class="empty-state">没有检测到中文语音，请用系统设置安装中文语音包</div>';
  const styles = [['natural','自然','🙂'],['gentle','温柔慢速','🌙'],['lively','活泼轻快','✨']];
  const styleHtml = styles.map(([k,label,ico]) =>
    `<button class="style-chip ${state.voiceStyle===k?'sel':''}" data-style="${k}">${ico} ${label}</button>`).join('');
  panel.innerHTML = `
    <button class="item-close" data-close="item">×</button>
    <div class="recharge-head"><div class="rh-icon">🎙️</div><h3>选择桃桃的声音</h3>
      <p>点"试听"听效果，点整行设为默认</p></div>
    <div class="voice-style-row"><span class="vs-label">说话风格</span>${styleHtml}</div>
    <div class="voice-list">${rows}</div>
    <div class="recharge-note">声音由你的设备提供。若觉得机械，可换一个声音或调慢语速试试～</div>`;
  $$('.style-chip').forEach(c => c.onclick = () => {
    state.voiceStyle = c.dataset.style; save();
    $$('.style-chip').forEach(x => x.classList.toggle('sel', x===c));
    const demo='今天也要一起开心存钱哦，我会陪着你把想要的慢慢存下来。';
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(demo); const v=getVoice();
      u.lang='zh-CN'; if(v)u.voice=v;
      if(state.voiceStyle==='gentle'){u.pitch=0.95;u.rate=0.85;}
      else if(state.voiceStyle==='lively'){u.pitch=1.2;u.rate=1.05;}
      else {const vc=getChar().voice||{pitch:1.0,rate:0.92}; u.pitch=vc.pitch;u.rate=vc.rate;}
      window.speechSynthesis.speak(u);
    }
  });
  modal.classList.remove('hidden');
  $$('[data-close="item"]').forEach(el => el.onclick = closeItem);
  $$('.voice-row').forEach(row => {
    row.addEventListener('click', (e) => {
      const uri = decodeURIComponent(row.dataset.voice);
      const v = allVoices.find(x => x.voiceURI === uri);
      if (e.target.classList.contains('vr-try')) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(`嗨～我是${getCharName()}，今天也要一起开心存钱哦！`);
        u.lang='zh-CN'; if(v) u.voice=v; u.pitch=(getChar().voice||{pitch:1}).pitch; u.rate=1;
        window.speechSynthesis.speak(u);
      } else {
        state.voiceURI = uri; save();
        $$('.voice-row').forEach(x=>x.classList.toggle('sel',x===row));
        toast('已设为桃桃的声音～');
      }
    });
  });
}

/* ============================================================
   对话审批引擎（预设智能对话，无需 API Key）
   ============================================================ */
let chatQuickItems = ['想买个耳机，能买吗？', '我已经存够啦', '怎么才能存得更快？', '今天也要加油'];

function openChat() {
  $('#chatModal').classList.remove('hidden');
  const body = $('#chatBody');
  body.innerHTML = '';
  renderQuick();
  const intro = (getChar().intro || '嗨～我是{name}！一起来存钱吧～\n你一共存了 {saved} 哦。')
    .replace('{saved}', fmt(state.totalSaved)).replace('{name}', getCharName());
  addMsg('them', intro);
  updateVoiceBtn();
  speak(intro);
  setTimeout(() => $('#chatInput').focus(), 200);
}
function closeChat() {
  $('#chatModal').classList.add('hidden');
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function renderQuick() {
  $('#chatQuick').innerHTML = chatQuickItems.map(q => `<button>${q}</button>`).join('');
  $$('#chatQuick button').forEach(b => b.addEventListener('click', () => {
    $('#chatInput').value = b.textContent;
    sendChat();
  }));
}
function addMsg(who, text) {
  const body = $('#chatBody');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const img = who === 'them'
    ? `<img class="msg-avatar" src="${getCharImg()}" alt="">`
    : '';
  div.innerHTML = `${img}<div class="msg-bubble"></div>`;
  $('.msg-bubble', div).textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function typeThen(who, text, after) {
  addMsg(who, '');
  const body = $('#chatBody');
  const bubble = body.lastElementChild.querySelector('.msg-bubble');
  let i = 0;
  bubble.textContent = '';
  const t = setInterval(() => {
    bubble.textContent = text.slice(0, ++i);
    body.scrollTop = body.scrollHeight;
    if (i >= text.length) {
      clearInterval(t);
      if (who === 'them') speak(text); // 角色回复完成后朗读
      after && after();
    }
  }, 22);
}

/* 审批逻辑：解析金额与目标，判断能否购买 */
function parseAmount(text) {
  // 优先取紧跟"元/块/yuan"的数字（最明确的价格）
  const withUnit = text.match(/(\d+(?:\.\d+)?)\s*(?:元|块|yuan)/i);
  if (withUnit) return Number(withUnit[1]);
  // 否则取所有数字里最大的那个（避开"iPhone 16 卖 5999"里的型号16）
  const nums = (text.match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(n => n > 0 && n < 1000000);
  if (!nums.length) return null;
  return Math.max(...nums);
}
/* 从"我想买一双699元的球鞋"里提取商品名 -> 球鞋 */
function extractItemName(text) {
  let name = '';
  const after = text.match(/\d+(?:\.\d+)?\s*(?:元|块)(?:钱)?([\u4e00-\u9fa5A-Za-z]{1,8})/);
  if (after) name = after[1];
  else {
    const before = text.match(/([\u4e00-\u9fa5A-Za-z]{1,8})\s*\d+(?:\.\d+)?\s*(?:元|块)/);
    if (before) name = before[1];
  }
  name = name.replace(/^(的|一个|一双|一件|一副|一台|这款|那个|呀|呢)/,'');
  name = name.replace(/(能买吗|可以买吗|能不能买|可以吗|买吗|能买|可以|吗|呢|吧|啊|呀)+$/g,'');
  name = name.replace(/(一个|一双|一件|一副|一台|这款|那个)$/g,'').trim();
  return name || '心仪好物';
}
function decidePurchase(text) {
  const amt = parseAmount(text);
  const total = state.totalSaved;
  const isAsk = /能买|可以买|想买|买吗|能不能|可以吗/.test(text);

  if (isAsk) {
    if (amt === null) {
      return { text:`想买的东西大概多少钱呀？告诉我价格，我帮你算算存够没有～\n比如直接说「想买个 300 元的耳机」。` };
    }
    if (total >= amt) {
      if (!state.approved.some(x => x.includes(String(amt)))) {
        state.approved.push(fmt(amt));
        // 审批通过只是"许可"，不是真实支出：记一条中性记录，不扣存款、不写负数流水
        state.records.unshift({ id: uid(), type: 'approve', amount: 0, name: `审批通过 · ${esc(extractItemName(text))}`, time: nowStr() });
        state.star += 5;
        save(); renderStars();
      }
      const itemName = extractItemName(text);
      return {
        text: `我看了看，你已经存了 ${fmt(total)}，够买 ${fmt(amt)} 的东西啦！\n审批通过～不过理性消费哦，买完记得继续存钱！送你 5 颗星星 ⭐`,
        stamp: 'pass',
        form: { item:itemName, amount:amt, opinion:'金额在存钱范围内，批准！记得理性消费哦。' }
      };
    }
    const lack = amt - total;
    const itemName = extractItemName(text);
    return {
      text: `还差 ${fmt(lack)} 呢，现在存了 ${fmt(total)}，目标是 ${fmt(amt)}。\n这次先别买啦，把钱存进存钱罐，等攒够了我第一个批准你！要不要现在存一笔？`,
      stamp: 'reject',
      form: { item:itemName, amount:amt, opinion:`还差 ${fmt(lack)}，钱不够就先别花啦，存够再说～` }
    };
  }
  return null;
}
/* 审批单卡片（wavefox 风格）：白卡 + 编号 + 商品/意见 + 金额 + 斜盖红章 */
function stampApproval(kind, form) {
  const body = $('#chatBody');
  if (!body) return;
  const pass = kind === 'pass';
  form = form || { item:'心仪好物', amount:0, opinion:'' };
  const no = 'No.' + String(Math.floor(1000 + Math.random()*9000));
  const el = document.createElement('div');
  el.className = 'approval-form-msg';
  el.innerHTML = `
    <div class="approval-form">
      <div class="af-head">
        <span class="af-title">${getCharName()}消费审批单</span>
        <span class="af-no">${no}</span>
      </div>
      <div class="af-body">
        <div class="af-left">
          <div class="af-item">${form.item}</div>
          <div class="af-opinion">审批意见：${form.opinion}</div>
        </div>
        <div class="af-amount">${fmt(form.amount)}</div>
      </div>
      <div class="af-foot">
        <span>${getCharName()}管家最终裁决 · 仅供存钱参考</span>
        <span class="af-stamp ${pass?'pass':'reject'}">
          <span class="afs-text">${pass?'通过':'驳回'}</span>
        </span>
      </div>
    </div>`;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  if (pass) setTimeout(playBell, 250);
}
function reply(text) {
  const t = text.trim();
  if (!t) return;
  addMsg('me', t);

  const decision = decidePurchase(t);
  const savedKeywords = /存|攒|收入/.test(t);
  const fasterKeywords = /快|怎么存|方法|建议|技巧/.test(t);
  const greetKeywords = /你好|嗨|在吗|早上|晚上/.test(t);
  const thanksKeywords = /谢谢|感谢|好的|嗯/.test(t);

  let answer = null, stamp = null, form = null;
  if (decision) { answer = decision.text; stamp = decision.stamp; form = decision.form; }
  else if (fasterKeywords) answer = `试试这样：\n1️⃣ 设一个小目标，比如「周末存 100」\n2️⃣ 每存一次钱能攒星星，扭蛋布置小家更有动力\n3️⃣ 想买东西先来问我，我帮你挡住冲动消费～\n坚持几天就会看到存钱罐慢慢满起来啦！`;
  else if (savedKeywords) answer = `好耶，又要存钱啦！去「存钱」页面把金额填进去，存钱罐会一点点变满，我看着都很开心～ 每存 10 元还有 1 颗星星哦 ⭐`;
  else if (thanksKeywords) answer = `不客气呀～ 有想买的随时来找我，我帮你把关！😊`;
  else if (greetKeywords) answer = `嗨嗨～ 今天也要认真存钱哦！有什么想买的、或者存钱的问题都可以问我。`;
  else answer = `（歪头想了想）你是想问「这个能不能买」吗？告诉我东西的名字和价格，我帮你算算存够没有～ 也可以问我怎么存钱更快哦！`;

  $('#chatInput').value = '';
  setTimeout(() => typeThen('them', answer, () => {
    if (stamp) setTimeout(() => stampApproval(stamp, form), 350); // 回复完成后盖章
    if (/存够|还差/.test(answer)) chatQuickItems = ['我现在去存钱', '换个便宜点的', '怎么才能存得更快？', '谢谢桃桃'];
    else chatQuickItems = ['想买个耳机，能买吗？', '我已经存够啦', '怎么才能存得更快？', '今天也要加油'];
    renderQuick();
  }), 400);
}
function sendChat() {
  const input = $('#chatInput');
  if (!input.value.trim()) return;
  reply(input.value);
}

/* ============================================================
   启动
   ============================================================ */
function init() {
  // 填充所有内嵌角色图片（data-img），彻底不依赖外部路径
  $$('[data-img]').forEach(img => { img.src = IMG[img.dataset.img]; });

  // 初始化语音
  initVoices();

  // 开屏音乐按钮
  $('#splashSound').addEventListener('click', () => toggleMusic());
  $('#musicBtn').addEventListener('click', () => toggleMusic());

  // 对话
  $('#chatSend').addEventListener('click', sendChat);
  $('#chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
  $$('[data-close="chat"]').forEach(el => el.addEventListener('click', closeChat));
  const vb = $('#chatVoiceBtn');
  if (vb) vb.addEventListener('click', () => {
    state.voiceOn = !state.voiceOn; save(); updateVoiceBtn();
    if (!state.voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    toast(state.voiceOn ? '语音播报已开启 🔊' : '语音播报已关闭 🔇');
  });
  const vs = $('#chatVoiceSetting'); if (vs) vs.addEventListener('click', openVoicePicker);

  // 底部导航
  $$('.nav-item').forEach(n => n.addEventListener('click', () => go(n.dataset.page)));

  // 角色选择
  initSetup();

  // 首次用户手势后启动挂起的音乐（浏览器自动播放策略）
  const kickMusic = () => {
    if (pendingMusicStart && state.musicOn && !musicTimer) { pendingMusicStart = false; startMusic(); }
  };
  document.addEventListener('pointerdown', kickMusic, { once: false });

  // 键盘可达性：Esc 关闭弹窗 + Tab 焦点陷阱
  document.addEventListener('keydown', (e) => {
    // 找到当前可见的弹窗（优先级：对话框 > 商品弹窗 > 聊天）
    const stack = ['#dialogModal','#itemModal','#chatModal']
      .map(s => $(s)).filter(el => el && !el.classList.contains('hidden'));
    if (!stack.length) return;
    const top = stack[stack.length - 1];
    if (e.key === 'Escape') {
      e.preventDefault();
      if (top.id === 'dialogModal') { const c=$('#dialogCancel'); if(c) c.click(); }
      else if (top.id === 'itemModal') closeItem();
      else closeChat();
      return;
    }
    if (e.key === 'Tab') {
      const focusables = $$('button:not([disabled]), input, [tabindex]:not([tabindex="-1"])', top)
        .filter(el => el.offsetParent !== null);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length-1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // 支付回跳查单补发
  checkPendingPay();

  // 开屏
  initSplash();
}
document.addEventListener('DOMContentLoaded', init);

</script>
